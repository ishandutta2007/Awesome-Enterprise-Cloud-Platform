<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(30px, -20px); opacity: 0.65; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
    }
    @keyframes pulseOrb2 {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
      50% { transform: scale(1.2) translate(-25px, 25px); opacity: 0.55; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
    }
    @keyframes floatPill1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPill2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -100; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; }
    .pill-1 { animation: floatPill1 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 5s ease-in-out infinite; }
    .pill-3 { animation: floatPill1 4.5s ease-in-out infinite 1s; }
    .stream-line { stroke-dasharray: 8, 8; animation: dashStream 4s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in the Background -->
  <circle class="orb-1" cx="200" cy="100" r="130" fill="#38bdf8" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="240" r="160" fill="#818cf8" filter="url(#glow)" />
  <circle class="orb-1" cx="620" cy="320" r="100" fill="#c084fc" filter="url(#glow)" />

  <!-- Animated Data Flow Rays -->
  <path class="stream-line" d="M 0 100 Q 300 200 600 80 T 1200 150" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.35" />
  <path class="stream-line" d="M 0 280 Q 400 150 800 290 T 1200 200" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.35" />

  <!-- Foreground Content: Titles (Protected in foreground) -->
  <g transform="translate(80, 75)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="235" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8" />
    <text x="30" y="19.5" fill="#bae6fd" font-size="12" font-weight="600" letter-spacing="1.5">ENTERPRISE CLOUD ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#titleGrad)" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome Enterprise Cloud Platform</text>

    <!-- Subtitle -->
    <text x="0" y="114" fill="#94a3b8" font-size="18" font-weight="400">Curated SaaS Platforms, Hyperscalers, Low-Code Engines &amp; Self-Hosted PaaS Solutions</text>
  </g>

  <!-- Dynamic Floating Feature Badges / Stat Cards -->
  <g class="pill-1" transform="translate(80, 240)">
    <rect width="210" height="52" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="18" y="24" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">HYPERSCALERS &amp; SAAS</text>
    <text x="18" y="42" fill="#f8fafc" font-size="14" font-weight="600">AWS • Azure • GCP • Salesforce</text>
  </g>

  <g class="pill-2" transform="translate(320, 240)">
    <rect width="220" height="52" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
    <text x="18" y="24" fill="#818cf8" font-size="11" font-weight="700" letter-spacing="1">OPEN-SOURCE PAAS</text>
    <text x="18" y="42" fill="#f8fafc" font-size="14" font-weight="600">Coolify • Dokploy • Dokku</text>
  </g>

  <g class="pill-3" transform="translate(570, 240)">
    <rect width="240" height="52" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" />
    <text x="18" y="24" fill="#c084fc" font-size="11" font-weight="700" letter-spacing="1">ENTERPRISE LOW-CODE</text>
    <text x="18" y="42" fill="#f8fafc" font-size="14" font-weight="600">Appsmith • ToolJet • Budibase</text>
  </g>

  <g class="pill-1" transform="translate(840, 240)">
    <rect width="280" height="52" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" />
    <text x="18" y="24" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1">ORCHESTRATION &amp; INTERNAL PORTALS</text>
    <text x="18" y="42" fill="#f8fafc" font-size="14" font-weight="600">Kubernetes • Backstage • Rancher</text>
  </g>

</svg>